<style>
:root{--wine:#591c31;--rose:#efdbde;--paper:#faf7f5;--ink:#302528;--muted:#6d5c62;--line:#d5bfc5}
*{box-sizing:border-box}body{margin:0;background:var(--rose);color:var(--ink);font:16px/1.5 Arial,Helvetica,sans-serif}
main{width:min(1180px,calc(100% - 32px));margin:24px auto;background:var(--paper);padding:28px 32px 24px;min-height:calc(100vh - 48px)}
header,footer{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:12px;color:var(--wine);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
h1{font:clamp(34px,6vw,66px)/1.05 Georgia,'Times New Roman',serif;font-weight:400;color:var(--wine);margin:30px 0 12px}
p{margin:0 0 18px}.actions{display:flex;gap:12px;margin:18px 0 24px}
a{display:inline-block;border:1px solid var(--wine);border-radius:4px;padding:10px 16px;background:var(--wine);color:white;text-decoration:none;font-weight:700}
a:hover{background:transparent;color:var(--wine)}.viewer{height:min(72vh,850px);min-height:440px;border:1px solid var(--line);background:white}
iframe{width:100%;height:100%;border:0}footer{border-top:1px solid var(--line);border-bottom:0;padding-top:14px;margin-top:20px;letter-spacing:.02em;text-transform:none}
@media(max-width:620px){main{padding:20px 18px}.viewer{min-height:65vh}.actions{flex-wrap:wrap}}
</style>
</head>
